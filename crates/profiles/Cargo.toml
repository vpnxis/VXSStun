[package]
name = "vxsstun-profiles"
version = "0.1.0"
edition = "2021"
license = "MIT"
[lib]
crate-type = ["rlib", "cdylib"]
[dependencies]
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
[profile.release]
strip = "debuginfo"
